<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор позиций ИГРУШЕК</title>
    <style>
        /* Жесткий полный экран без полос и скролла */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            user-select: none; /* Запрещаем выделение текста */
        }

        /* Фон растягивается от края до края */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* КОРПУС АВТОМАТА (z-index 10) - Статичный ориентир */
        #machine-no-claw {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 95%; /* Чуть меньше окна */
            pointer-events: none; /* Не мешает кликам сквозь себя */
            z-index: 10;
        }

        /* --- Настройки для Драггаблов (Игрушек) --- */
        .draggable {
            position: absolute;
            resize: both; /* Позволяет менять размер */
            overflow: hidden;
            border: 2px dashed #00ff00; /* Зеленая пунктирная рамка */
            background: rgba(0, 255, 0, 0.2);
            cursor: move;
            z-index: 100; /* Поверх автомата, чтобы было удобно */
        }

        /* Картинка игрушки внутри драггабла */
        .draggable img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Сохраняет пропорции картинки внутри рамки */
            pointer-events: none; /* Разрешает drag-and-drop самой рамки */
        }

        /* Метка с ID */
        .toy-label {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 12px;
            padding: 2px 5px;
            pointer-events: none;
        }

        /* --- Всплывающее окно с JSON (код) --- */
        #output-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; 
            justify-content: center; align-items: center; color: white;
        }
        textarea { width: 80%; height: 60%; font-family: monospace; font-size: 14px; padding: 10px; margin-top: 20px; color: #00ff00; background: #111; border: 1px solid #333; }
        h1 { margin: 0; color: #00ff00; }
        p { margin: 5px 0 20px 0; }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="machine-no-claw" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/avtomat.png">

        <div class="draggable" id="toy-1" style="left: 41.53%; top: 29.86%; width: 3.97%; height: 9.19%;">
            <span class="toy-label">1.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/1.png">
        </div>
        <div class="draggable" id="toy-4" style="left: 47.45%; top: 30.27%; width: 3.97%; height: 9.32%;">
            <span class="toy-label">4.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/4.png">
        </div>
        <div class="draggable" id="toy-6" style="left: 53.36%; top: 30.00%; width: 4.37%; height: 9.05%;">
            <span class="toy-label">6.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/6.png">
        </div>

        <div class="draggable" id="toy-5" style="left: 40.86%; top: 40.27%; width: 4.91%; height: 9.59%;">
            <span class="toy-label">5.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/5.png">
        </div>
        <div class="draggable" id="toy-3" style="left: 47.65%; top: 40.68%; width: 3.76%; height: 9.32%;">
            <span class="toy-label">3.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/3.png">
        </div>
        <div class="draggable" id="toy-2" style="left: 53.36%; top: 40.27%; width: 4.37%; height: 9.59%;">
            <span class="toy-label">2.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/2.png">
        </div>

        <div class="draggable" id="toy-9" style="left: 40.52%; top: 50.95%; width: 5.31%; height: 10.27%;">
            <span class="toy-label">9.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/9.png">
        </div>
        <div class="draggable" id="toy-8" style="left: 47.31%; top: 51.35%; width: 4.37%; height: 9.86%;">
            <span class="toy-label">8.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/8.png">
        </div>
        <div class="draggable" id="toy-7" style="left: 53.63%; top: 51.08%; width: 4.50%; height: 10.27%;">
            <span class="toy-label">7.png</span>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/7.png">
        </div>

    </div>

    <div id="output-overlay">
        <h1>СУПЕР! Координаты зафиксированы!</h1>
        <p>Скопируйте весь текст ниже и отправьте его мне:</p>
        <textarea id="config-text" readonly></textarea>
    </div>

    <script>
        const container = document.getElementById('game-container');
        let dragEl = null;
        let offsetX = 0, offsetY = 0;

        // 1. Инициализация логики перетаскивания (для всех элементов с классом draggable)
        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const rect = el.getBoundingClientRect();
                
                // Проверяем, не кликнул ли пользователь в правый нижний угол (зона изменения размера)
                // Отступаем 25px от края
                const isResize = (e.clientX > rect.right - 25) && (e.clientY > rect.bottom - 25);

                if (!isResize) {
                    dragEl = el;
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    
                    // Подносим перетаскиваемый элемент поверх остальных (среди игрушек)
                    document.querySelectorAll('.draggable').forEach(d => d.style.zIndex = 100);
                    el.style.zIndex = 101;
                }
            });
        });

        // 2. Глобальный обработчик движения мыши
        document.addEventListener('mousemove', (e) => {
            if (dragEl) {
                // Высчитываем координаты относительно контейнера
                const containerRect = container.getBoundingClientRect();
                let newLeft = e.clientX - containerRect.left - offsetX;
                let newTop = e.clientY - containerRect.top - offsetY;
                
                // Ставим новые координаты (в пикселях пока)
                dragEl.style.left = newLeft + 'px';
                dragEl.style.top = newTop + 'px';
            }
        });

        // 3. Обработчик отпускания кнопки мыши
        document.addEventListener('mouseup', () => {
            if (dragEl) {
                dragEl = null;
            }
        });

        // 4. Глобальный обработчик нажатия Enter для сохранения
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let config = {};
                
                // Получаем ширину и высоту контейнера в пикселях
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;

                // Loop по всем игрушкам
                document.querySelectorAll('.draggable').forEach(el => {
                    // Высчитываем координаты в % относительно размера окна
                    // Используем .toFixed(2) для округления до 2 знаков
                    config[el.id] = {
                        left: (el.offsetLeft / containerWidth * 100).toFixed(2) + '%',
                        top: (el.offsetTop / containerHeight * 100).toFixed(2) + '%',
                        width: (el.offsetWidth / containerWidth * 100).toFixed(2) + '%',
                        height: (el.offsetHeight / containerHeight * 100).toFixed(2) + '%'
                    };
                });

                // Выводим JSON в textarea и показываем оверлей
                document.getElementById('config-text').value = JSON.stringify(config, null, 4);
                document.getElementById('output-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
