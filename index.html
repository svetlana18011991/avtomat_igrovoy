<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор Игры (Режим Сборки)</title>
    <style>
        /* Полный экран */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #222; overflow: hidden; font-family: sans-serif; }
        
        #game-container { 
            position: relative; 
            width: 100vw; 
            max-width: 177.78vh; /* 16:9 aspect ratio */
            height: 56.25vw;
            max-height: 100vh;
            margin: auto; /* Центрирование */
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png'); 
            background-size: cover; 
            background-position: center; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
            z-index: 0;
        }

        /* Автомат на фоне (чтобы видеть куда ставить) */
        #machine { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); 
            height: 95%; pointer-events: none; z-index: 1; 
        }

        /* Стиль для всех перетаскиваемых элементов */
        .draggable {
            position: absolute;
            resize: both; /* Позволяет менять размер */
            overflow: hidden;
            border: 2px dashed #00ff00; /* Зеленая рамка для видимости */
            background: rgba(0, 255, 0, 0.1);
            cursor: move;
            z-index: 10; /* Все поверх */
            /* Начальные размеры, чтобы не терялись */
            width: 80px; height: 80px; top: 10px; left: 10px;
        }

        /* Убираем конфликт картинки с перетаскиванием */
        .draggable img {
            width: 100%; height: 100%; object-fit: contain; pointer-events: none;
        }

        /* Кнопки (визуально, как в игре) */
        .config-btn {
            background: radial-gradient(circle, #ff6b6b, #ee5253);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        /* Визуальные заглушки для невидимых зон */
        #drop-area { border-color: #ff0000; background: rgba(255, 0, 0, 0.2); }
        #drop-area::after { content: "МЕСТО ПАДЕНИЯ"; position: absolute; color: white; font-size: 10px; text-align: center; top: 50%; width: 100%; transform: translateY(-50%); }
        
        #progress-area { border-color: #0000ff; background: rgba(0, 0, 255, 0.2); width: 60px; height: 400px;}
        #progress-area::after { content: "ПАНЕЛЬ ПРОГРЕССА"; position: absolute; color: white; font-size: 10px; text-align: center; top: 50%; width: 100%; transform: translateY(-50%) rotate(-90deg); }

        /* Всплывающее окно с результатами */
        #output-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; 
            justify-content: center; align-items: center; color: white;
        }
        textarea { width: 80%; height: 60%; font-family: monospace; font-size: 14px; padding: 10px; margin-top: 20px; color: #00ff00; background: #111; border: 1px solid #333; }
        h1 { margin: 0; color: #00ff00; }
        p { margin: 5px 0 20px 0; }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="machine" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/avtomat.png">
        
        <div id="elements-wrapper"></div>
    </div>

    <div id="output-overlay">
        <h1>СУПЕР! Координаты зафиксированы!</h1>
        <p>Скопируйте весь текст ниже и отправьте его мне (ИИ):</p>
        <textarea id="config-text" readonly></textarea>
    </div>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/';
        const wrapper = document.getElementById('elements-wrapper');
        const container = document.getElementById('game-container');
        
        // Список того, что нам нужно расставить
        const itemsToPlace = [
            { id: 'toy-1', type: 'img', src: '1.png' },
            { id: 'toy-2', type: 'img', src: '2.png' },
            { id: 'toy-3', type: 'img', src: '3.png' },
            { id: 'toy-4', type: 'img', src: '4.png' },
            { id: 'toy-5', type: 'img', src: '5.png' },
            { id: 'toy-6', type: 'img', src: '6.png' },
            { id: 'toy-7', type: 'img', src: '7.png' },
            { id: 'toy-8', type: 'img', src: '8.png' },
            { id: 'toy-9', type: 'img', src: '9.png' },
            { id: 'claw', type: 'img', src: 'клешня.png' }, // Ставим стартовую
            { id: 'coin', type: 'img', src: 'монета.png' },
            { id: 'btn-left', type: 'div', content: '<div class="config-btn">◀</div>' },
            { id: 'btn-right', type: 'div', content: '<div class="config-btn">▶</div>' },
            { id: 'btn-action', type: 'div', content: '<div class="config-btn">🔘</div>' },
            { id: 'drop-area', type: 'zone' }, // Зона падения
            { id: 'progress-area', type: 'zone' } // Зона прогресса
        ];

        // 1. Создаем элементы на экране
        itemsToPlace.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'draggable';
            el.id = item.id;
            
            // Расставляем их лесенкой, чтобы не терялись
            el.style.left = (20 + index * 20) + 'px';
            el.style.top = (20 + index * 20) + 'px';

            if (item.type === 'img') {
                el.innerHTML = `<img src="${baseUrl}${item.src}">`;
            } else if (item.type === 'div') {
                el.innerHTML = item.content;
            }
            wrapper.appendChild(el);
        });

        // 2. Логика перетаскивания (не мешая изменения размера)
        let dragEl = null;
        let offsetX = 0, offsetY = 0;

        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const rect = el.getBoundingClientRect();
                // Проверяем, не кликнул ли пользователь в правый нижний угол (зона изменения размера)
                const isResize = (e.clientX > rect.right - 25) && (e.clientY > rect.bottom - 25);

                if (!isResize) {
                    dragEl = el;
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    // Все, что перетаскивается, становится поверх
                    document.querySelectorAll('.draggable').forEach(d => d.style.zIndex = 10);
                    el.style.zIndex = 100;
                }
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (dragEl) {
                const containerRect = container.getBoundingClientRect();
                let newLeft = e.clientX - containerRect.left - offsetX;
                let newTop = e.clientY - containerRect.top - offsetY;
                
                // Ограничиваем перетаскивание внутри контейнера
                newLeft = Math.max(0, Math.min(newLeft, container.offsetWidth - dragEl.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, container.offsetHeight - dragEl.offsetHeight));
                
                dragEl.style.left = newLeft + 'px';
                dragEl.style.top = newTop + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (dragEl) { dragEl = null; }
        });

        // 3. Сохранение координат при нажатии Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let config = {};
                document.querySelectorAll('.draggable').forEach(el => {
                    const containerWidth = container.offsetWidth;
                    const containerHeight = container.offsetHeight;
                    
                    config[el.id] = {
                        left: (el.offsetLeft / containerWidth * 100).toFixed(2) + '%',
                        top: (el.offsetTop / containerHeight * 100).toFixed(2) + '%',
                        width: (el.offsetWidth / containerWidth * 100).toFixed(2) + '%',
                        height: (el.offsetHeight / containerHeight * 100).toFixed(2) + '%'
                    };
                });

                document.getElementById('config-text').value = JSON.stringify(config, null, 4);
                document.getElementById('output-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
