<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Режим Сборки Игры</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #222; font-family: sans-serif; overflow: hidden; }
        
        #game-container { 
            position: relative; 
            width: 800px; /* Можете изменить размер окна, если нужно */
            height: 600px; 
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png'); 
            background-size: cover; 
            background-position: center; 
            box-shadow: 0 0 20px rgba(0,0,0,0.8); 
        }

        /* Сам автомат (не двигаем, он на фоне) */
        #machine { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); 
            height: 95%; pointer-events: none; z-index: 1; 
        }

        /* Стиль для всех перетаскиваемых элементов */
        .draggable {
            position: absolute;
            resize: both; /* Позволяет менять размер */
            overflow: hidden;
            border: 2px dashed #00ff00; /* Зеленая рамка для видимости */
            background: rgba(0, 255, 0, 0.1);
            cursor: move;
            z-index: 10;
            /* Начальные размеры, чтобы не терялись */
            width: 60px; height: 60px; top: 10px; left: 10px;
        }

        /* Убираем конфликт картинки с перетаскиванием */
        .draggable img {
            width: 100%; height: 100%; object-fit: contain; pointer-events: none;
        }

        /* Визуальные заглушки для невидимых зон */
        #drop-area { border-color: #ff0000; background: rgba(255, 0, 0, 0.2); }
        #drop-area::after { content: "Куда падает игрушка"; position: absolute; color: white; font-size: 10px; text-align: center; top: 50%; width: 100%; }
        
        #progress-area { border-color: #0000ff; background: rgba(0, 0, 255, 0.2); }
        #progress-area::after { content: "Зона для собранных"; position: absolute; color: white; font-size: 10px; text-align: center; top: 50%; width: 100%; }

        /* Всплывающее окно с результатами */
        #output-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; 
            justify-content: center; align-items: center; color: white;
        }
        textarea { width: 80%; height: 60%; font-family: monospace; font-size: 14px; padding: 10px; margin-top: 20px; }
        h1 { margin: 0; color: #00ff00; }
        p { margin: 5px 0 20px 0; }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="machine" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/avtomat.png">
        
        <div id="elements-wrapper"></div>
    </div>

    <div id="output-overlay">
        <h1>СУПЕР! Координаты зафиксированы!</h1>
        <p>Скопируйте весь текст ниже и отправьте его мне (ИИ):</p>
        <textarea id="config-text"></textarea>
    </div>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/';
        const wrapper = document.getElementById('elements-wrapper');
        
        // Список того, что нам нужно расставить
        const itemsToPlace = [
            { id: 'toy-1', type: 'img', src: '1.png' },
            { id: 'toy-2', type: 'img', src: '2.png' },
            { id: 'toy-3', type: 'img', src: '3.png' },
            { id: 'toy-4', type: 'img', src: '4.png' },
            { id: 'toy-5', type: 'img', src: '5.png' },
            { id: 'toy-6', type: 'img', src: '6.png' },
            { id: 'toy-7', type: 'img', src: '7.png' },
            { id: 'toy-8', type: 'img', src: '8.png' },
            { id: 'toy-9', type: 'img', src: '9.png' },
            { id: 'claw', type: 'img', src: 'клешня.png' },
            { id: 'coin', type: 'img', src: 'монета.png' },
            { id: 'btn-left', type: 'div', content: '<div style="background:radial-gradient(circle, #ff6b6b, #ee5253);border-radius:50%;width:100%;height:100%;border:2px solid white;color:white;display:flex;justify-content:center;align-items:center;font-size:24px;">◀</div>' },
            { id: 'btn-right', type: 'div', content: '<div style="background:radial-gradient(circle, #ff6b6b, #ee5253);border-radius:50%;width:100%;height:100%;border:2px solid white;color:white;display:flex;justify-content:center;align-items:center;font-size:24px;">▶</div>' },
            { id: 'btn-down', type: 'div', content: '<div style="background:radial-gradient(circle, #ff6b6b, #ee5253);border-radius:50%;width:100%;height:100%;border:2px solid white;color:white;display:flex;justify-content:center;align-items:center;font-size:24px;">▼</div>' },
            { id: 'btn-action', type: 'div', content: '<div style="background:radial-gradient(circle, #ff6b6b, #ee5253);border-radius:50%;width:100%;height:100%;border:2px solid white;color:white;display:flex;justify-content:center;align-items:center;font-size:24px;">🔘</div>' },
            { id: 'drop-area', type: 'zone' }, // Зона падения
            { id: 'progress-area', type: 'zone' } // Зона прогресса
        ];

        // 1. Создаем элементы на экране
        itemsToPlace.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'draggable';
            el.id = item.id;
            
            // Чтобы они не накладывались друг на друга на старте, сдвигаем их лесенкой
            el.style.left = (index * 15) + 'px';
            el.style.top = (index * 15) + 'px';

            if (item.type === 'img') {
                el.innerHTML = `<img src="${baseUrl}${item.src}">`;
            } else if (item.type === 'div') {
                el.innerHTML = item.content;
            }
            wrapper.appendChild(el);
        });

        // 2. Логика перетаскивания (не мешая изменению размера)
        let dragEl = null;
        let offsetX = 0, offsetY = 0;
        const container = document.getElementById('game-container');

        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const rect = el.getBoundingClientRect();
                // Проверяем, не кликнул ли пользователь в правый нижний угол (зона изменения размера)
                const isResize = (e.clientX > rect.right - 25) && (e.clientY > rect.bottom - 25);

                if (!isResize) {
                    dragEl = el;
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    el.style.zIndex = 100; // Выводим на передний план при перетаскивании
                }
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (dragEl) {
                const containerRect = container.getBoundingClientRect();
                let newLeft = e.clientX - containerRect.left - offsetX;
                let newTop = e.clientY - containerRect.top - offsetY;
                
                dragEl.style.left = newLeft + 'px';
                dragEl.style.top = newTop + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (dragEl) {
                dragEl.style.zIndex = 10; // Возвращаем обычный слой
                dragEl = null;
            }
        });

        // 3. Сохранение координат при нажатии Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let config = {};
                document.querySelectorAll('.draggable').forEach(el => {
                    // Высчитываем координаты в процентах для лучшей адаптивности
                    const containerWidth = container.offsetWidth;
                    const containerHeight = container.offsetHeight;
                    
                    config[el.id] = {
                        left: (el.offsetLeft / containerWidth * 100).toFixed(2) + '%',
                        top: (el.offsetTop / containerHeight * 100).toFixed(2) + '%',
                        width: (el.offsetWidth / containerWidth * 100).toFixed(2) + '%',
                        height: (el.offsetHeight / containerHeight * 100).toFixed(2) + '%'
                    };
                });

                document.getElementById('config-text').value = JSON.stringify(config, null, 4);
                document.getElementById('output-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
