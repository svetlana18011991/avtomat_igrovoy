  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Neucha&display=swap');
    html, body { height: 100%; margin: 0; overflow: hidden; position: relative; }
    :root{ --text:#eaf0ff; --muted:#a9b6e6; --border: rgba(255,255,255,.10); --shadow2: 0 12px 34px rgba(0,0,0,.40); --radius: 18px; --radius2: 22px; --neon:#d6b14a; --danger:#ff4d4d; --ok:#2dd27d; }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{ color:var(--text); background: radial-gradient(1100px 700px at 12% 18%, rgba(35,82,200,.28) 0%, rgba(5,8,22,0) 58%), radial-gradient(900px 640px at 88% 16%, rgba(20,160,255,.18) 0%, rgba(5,8,22,0) 62%), radial-gradient(1000px 780px at 55% 112%, rgba(214,177,74,.14) 0%, rgba(5,8,22,0) 58%), linear-gradient(180deg, rgba(4,10,32,.92), rgba(3,6,18,1)); }

    /* Основные стили кнопок автомата — исправленные, без белой подсветки */
    .control-btn{
      position:absolute;
      z-index:100;
      opacity:0;
      pointer-events:none;
      cursor:pointer;
      border-radius:20px;
      transition:transform 0.1s;
      background:transparent !important;
      -webkit-tap-highlight-color: transparent;
      outline:none;
      box-shadow:none;
    }

    .control-btn.active{
      pointer-events:auto;
      opacity:0;
    }

    .control-btn.active:hover,
    .control-btn.active:active,
    .control-btn:focus,
    .control-btn:focus-visible{
      opacity:0 !important;
      background:transparent !important;
      outline:none !important;
      box-shadow:none !important;
    }

    .control-btn.active:active{
      transform:scale(0.95);
    }

    /* Остальные стили из файла остаются без изменений */
    html:has(body.gameOnly), body.gameOnly { min-height: 100vh; min-height: 100dvh; overflow: hidden; touch-action: manipulation; }
    body.gameOnly #gameRoot { min-height: 100vh; min-height: 100dvh; width: 100%; overflow: hidden; }
    .app { display: grid; grid-template-columns: 460px 1fr; gap: 14px; padding: 14px; max-width: 1540px; margin: 0 auto; height: 100vh; max-height: 100vh; overflow: hidden; box-sizing: border-box; }
