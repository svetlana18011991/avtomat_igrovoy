<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра: Найди слово</title>
<style>
  :root {
    --primary: #6c63ff;
    --primary-dark: #574fd6;
    --secondary: #ff6584;
    --bg: #f0f2ff;
    --card: #ffffff;
    --text: #2d2d2d;
    --muted: #888;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(108,99,255,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--primary) 0%, #a18fff 100%);
    color: #fff;
    padding: 28px 24px 18px;
    text-align: center;
    border-radius: 0 0 32px 32px;
    box-shadow: 0 4px 24px rgba(108,99,255,0.18);
    margin-bottom: 28px;
  }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
  header p  { font-size: 1rem; opacity: .85; margin-top: 6px; }

  .container { max-width: 820px; margin: 0 auto; padding: 0 16px 40px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 22px;
  }
  .card h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---- language toggle ---- */
  .lang-toggle {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 18px;
  }
  .lang-btn {
    padding: 6px 18px;
    border-radius: 20px;
    border: 2px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    font-size: .95rem;
  }
  .lang-btn.active, .lang-btn:hover {
    background: var(--primary);
    color: #fff;
  }

  /* ---- inputs ---- */
  label { font-size: .93rem; font-weight: 600; display: block; margin-bottom: 5px; color: #555; }
  input[type=text], textarea, select {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border .2s;
    background: #fafbff;
    font-family: inherit;
  }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--primary); }
  textarea { resize: vertical; min-height: 90px; }

  /* ---- grid pairs ---- */
  #pairsContainer { display: flex; flex-direction: column; gap: 10px; }
  .pair-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .pair-row input { margin: 0; }
  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.3rem;
    padding: 4px 7px;
    border-radius: 8px;
    transition: background .15s;
    line-height: 1;
  }
  .btn-icon:hover { background: #f0f0f0; }

  /* ---- buttons ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 22px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #b0a8ff; cursor: not-allowed; }
  .btn-secondary { background: #f0f2ff; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-secondary:hover { background: #e0e2ff; }
  .btn-danger { background: #fff0f3; color: var(--secondary); border: 1.5px solid var(--secondary); }
  .btn-danger:hover { background: #ffe0e8; }
  .btn-sm { padding: 7px 15px; font-size: .93rem; }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

  /* ---- preview ---- */
  #previewWrapper {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid #e0e0f0;
    background: #fafbff;
    min-height: 340px;
  }
  #previewFrame {
    width: 100%;
    border: none;
    display: block;
    min-height: 340px;
  }

  /* ---- toast ---- */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #333;
    color: #fff;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 1rem;
    z-index: 9999;
    transition: transform .3s ease, opacity .3s ease;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ---- modal ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000;
    padding: 16px;
  }
  .modal-box {
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px 24px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,.18);
    position: relative;
    animation: popIn .22s ease;
  }
  @keyframes popIn {
    from { transform: scale(.92); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; font-size: 1.5rem;
    cursor: pointer; color: #aaa; line-height: 1;
  }
  .modal-close:hover { color: #555; }
  .modal-box h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; color: var(--primary); }
  .modal-box p  { font-size: .97rem; color: #555; margin-bottom: 14px; line-height: 1.6; }
  .modal-code {
    width: 100%;
    font-family: monospace;
    font-size: .82rem;
    padding: 12px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    background: #f7f8ff;
    resize: vertical;
    min-height: 90px;
    color: #333;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  /* ---- range ---- */
  input[type=range] {
    accent-color: var(--primary);
    width: 100%;
    margin: 6px 0;
  }

  /* ---- color picker row ---- */
  .color-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .color-row label { margin: 0; min-width: 160px; }
  input[type=color] {
    width: 44px;
    height: 34px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    padding: 2px;
    cursor: pointer;
    background: #fafbff;
  }

  /* ---- section toggle ---- */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    margin-bottom: 0;
  }
  .section-header h2 { margin-bottom: 0; cursor: pointer; }
  .section-body { margin-top: 16px; }
  .chevron { transition: transform .25s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }

  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .pair-row { grid-template-columns: 1fr 1fr auto; }
    .modal-box { padding: 22px 14px 18px; }
    .btn { font-size: .93rem; padding: 9px 16px; }
  }

function toast(msg, dur = 2800) {
  const t = $('toast');

  setTimeout(() => t.classList.remove('show'), dur);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}

function selfPageUrl() {

function tr(key, ...args) {
  const d = i18n[currentLang] || i18n.ru;
  const v = d[key] ?? (i18n.ru[key] ?? key);
  return typeof v === 'function' ? v(...args) : v;
}

function setLang(lang) {

  $('langKz').classList.toggle('active', lang === 'kz');

}

// ============================================================
// SECTION TOGGLE
// ============================================================
function toggleSection(id) {
  const body = $(id);
  const chevId = 'chev' + id.replace('sec','');
  const chev = $(chevId);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : '';
  if (chev) chev.classList.toggle('open', !open);
}

// ============================================================
// PAIRS
// ============================================================
let pairCount = 0;

function addPair(word = '', hint = '') {
  pairCount++;
  const id = pairCount;
  const div = document.createElement('div');
  div.className = 'pair-row';
  div.id = 'pair_' + id;
  div.innerHTML = `
    <input class="pair-word" type="text" placeholder="${tr('wordPlaceholder')}" value="${escHtml(word)}">
    <input class="pair-hint" type="text" placeholder="${tr('hintPlaceholder')}" value="${escHtml(hint)}">
    <button class="btn-icon" onclick="removePair('pair_${id}')" title="Удалить">🗑️</button>
  `;
  $('pairsContainer').appendChild(div);
}

function removePair(id) {
  const el = $(id);
  if (el) el.remove();
}

function clearPairs() {
  $('pairsContainer').innerHTML =  $('pairsContainer').innerHTML = '';
  pairCount = 0;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getPairs() {
  const rows = $('pairsContainer').querySelectorAll('.pair-row');
  const result = [];
  rows.forEach(row => {
    const w = row.querySelector('.pair-word').value.trim().toUpperCase();
    const h = row.querySelector('.pair-hint').value.trim();
    if (w) result.push({ word: w, hint: h });
  });
  return result;
}

const THEMES = {
  violet: { c1:'#6c63ff', c2:'#f0f2ff', c3:'#2d2d2d', c4:'#c4b5fd' },
  ocean:  { c1:'#0077b6', c2:'#e0f4ff', c3:'#023e8a', c4:'#90e0ef' },
  forest: { c1:'#2d6a4f', c2:'#f0fff4', c3:'#1b4332', c4:'#95d5b2' },

  candy:  { c1:'#f72585', c2:'#fff0f8', c3:'#3a0ca3', c4:'#f8b4d9' },
};

function onThemeChange() {
  const val = $('themeSelect').value;
  $('customColors').style.display = val === 'custom' ? '' : 'none';
  if (val !== 'custom' && THEMES[val]) {
    const t = THEMES[val];
    $('c1').value = t.c1;
    $('c2').value = t.c2;
    $('c3').value = t.c3;
    $('c4').value = t.c4;
  }

function getColors() {
  const val = $('themeSelect').value;
  if (val !== 'custom' && THEMES[val]) return THEMES[val];
  return {
    c1: $('c1').value,
    c2: $('c2').value,
    c3: $('c3').value,
    c4: $('c4').value,
  };
}

// ============================================================
// BUILD PAYLOAD
// ============================================================
function buildPayload(forPreview = false) {
  const pairs    = getPairs();
  const colors   = getColors();
  const fontSize = parseInt($('fontSize').value) || 20;
  const gridSize = parseInt($('gridSize').value) || 12;
  const maxTime  = parseInt($('maxTime').value)  || 0;
  const allowRev = $('allowReverse').checked;
  const title    = $('gameTitle').value.trim()    || 'Найди слово';
  const instr    = $('instruction').value.trim();

  return {
    title, instr, pairs, colors, fontSize,
    gridSize, maxTime, allowRev,
    lang: currentLang,
  };
}

// ============================================================
// ENCODE / DECODE
// ============================================================
function encodeGameData(payload) {
  try {
    return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  } catch(e) { return ''; }
}

// ============================================================
// PREVIEW
// ============================================================
function buildGameHTML(payload) {
  const dataStr = encodeGameData(payload);
  return getGamePageHTML(dataStr);
}

function refreshPreview() {
  const payload = buildPayload(true);
  const html    = buildGameHTML(payload);
  const frame   = $('previewFrame');
  const blob    = new Blob([html], { type:'text/html' });
  const url     = URL.createObjectURL(blob);
  frame.src     = url;
  frame.style.minHeight = '380px';
}

$('btnCopyCode').addEventListener('click', async () => {
  const btn = $('btnCopyCode');
  const originalHTML = btn.innerHTML;
  const pairs = getPairs();

  if (pairs.length === 0) {
    toast('⚠️ Добавьте хотя бы одно слово!');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '⏳ <span>' + (currentLang === 'kz' ? 'Дайындалуда...' : 'Подготовка...') + '</span>';

  // 1. Генерируем уникальный ID и ссылку
  const uniqueId  = 'g_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  const shortUrl  = selfPageUrl() + '?id=' + uniqueId;
  const iframeCode = `<iframe src="${shortUrl}" width="100%" height="500" frameborder="0" allow="autoplay; fullscreen; clipboard-write" allowfullscreen style="border-radius:16px;border:none;"></iframe>`;

  // 2. ✅ КОПИРУЕМ СРАЗУ — пока жест пользователя ещё активен
  const copyOk = await copyToClipboard(iframeCode);

  // 3. Показываем промежуточный статус
  btn.innerHTML = '☁️ <span>' + (currentLang === 'kz' ? 'Бұлтқа сақтауда...' : 'Сохранение в облаке...') + '</span>';

  // 4. Теперь сохраняем в Firebase (async уже не мешает копированию)
  try {
    const payload      = buildPayload(false);
    const compressedData = encodeGameData(payload);

    await db.ref('games/' + uniqueId).set({
      d: compressedData,
      t: Date.now(),
    });

    // 5. Сообщаем результат
    if (copyOk) {
      toast(tr('copiedOk') + '  ' + tr('savedCloud'));
    } else {
      openManualCopyModal(iframeCode, shortUrl);
    }

  } catch (err) {
    console.error('Firebase save error:', err);
    // Сохранение не удалось — всё равно показываем код
    if (copyOk) {
      toast(tr('errSave'));
    } else {
      openManualCopyModal(iframeCode, shortUrl);
    }
  }

  btn.innerHTML = originalHTML;
  btn.disabled  = false;
});

// --- WORD SEARCH ENGINE ---
function buildGrid(size, words, allowRev) {
  const grid = Array.from({length:size}, () => Array(size).fill(''));
  const placed = [];
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  if (allowRev) {
    DIRS.push([0,-1],[-1,0],[-1,-1],[-1,1]);
  }
  const alpha = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';

  for (const {word, hint} of words) {
    let ok = false;
    for (let attempt = 0; attempt < 200 && !ok; attempt++) {
      const dir = DIRS[Math.floor(Math.random()*DIRS.length)];
      const maxR = size - (dir[0] > 0 ? word.length : (dir[0] < 0 ? word.length-1 : 0));
      const minR = dir[0] < 0 ? word.length - 1 : 0;
      const maxC = size - (dir[1] > 0 ? word.length : (dir[1] < 0 ? word.length-1 : 0));
      const minC = dir[1] < 0 ? word.length - 1 : 0;
      if (maxR < minR || maxC < minC) continue;
      const r = minR + Math.floor(Math.random()*(maxR-minR+1));
      const c = minC + Math.floor(Math.random()*(maxC-minC+1));
      let fits = true;
      for (let i = 0; i < word.length; i++) {
        const nr = r + dir[0]*i, nc = c + dir[1]*i;
        if (grid[nr][nc] !== '' && grid[nr][nc] !== word[i]) { fits = false; break; }
      }
      if (!fits) continue;
      const cells = [];
      for (let i = 0; i < word.length; i++) {
        const nr = r + dir[0]*i, nc = c + dir[1]*i;
        grid[nr][nc] = word[i];
        cells.push([nr,nc]);
      }
      placed.push({word, hint, cells});
      ok = true;
    }
  }

  // fill blanks
  for (let r = 0; r < size; r++)
    for (let c = 0; c < size; c++)
      if (!grid[r][c]) grid[r][c] = alpha[Math.floor(Math.random()*alpha.length)];

  return {grid, placed};
}

// --- GAME STATE ---
let state = {};

function startGame(payload) {
  const {title,instr,pairs,colors,fontSize,gridSize,maxTime,allowRev,lang} = payload;

  // apply CSS vars
  const r = document.documentElement.style;
  r.setProperty('--p',  colors.c1);
  r.setProperty('--bg', colors.c2);
  r.setProperty('--fg', colors.c3);
  r.setProperty('--found', colors.c4);
  r.setProperty('--fs', fontSize + 'px');
  document.body.style.background = colors.c2;

  document.getElementById('gTitle').textContent = title;
  document.getElementById('instr').textContent  = instr || '';

  const {grid, placed} = buildGrid(gridSize, pairs, allowRev);

  state = {
    grid, placed, gridSize,
    found: new Set(),
    sel: [],
    selSet: new Set(),
    dragging: false,
    maxTime,
    timeLeft: maxTime,
    timerInterval: null,
    lang: lang || 'ru',
  };

  renderGrid();
  renderWordList();
  startTimer();

  document.getElementById('msg').textContent = '';
  document.getElementById('restartBtn').onclick = () => startGame(payload);
}

function renderGrid() {
  const tbl = document.getElementById('grid');
  tbl.innerHTML = '';
  for (let r = 0; r < state.gridSize; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < state.gridSize; c++) {
      const td  = document.createElement('td');
      td.textContent = state.grid[r][c];
      td.dataset.r   = r;
      td.dataset.c   = c;

      const key = r+','+c;
      if (state.found.has(key))  td.classList.add('found');
      if (state.selSet.has(key)) td.classList.add('sel');

      td.addEventListener('pointerdown', onPDown);
      td.addEventListener('pointerenter', onPEnter);
      td.addEventListener('pointerup', onPUp);
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
}

function renderWordList() {
  const wl = document.getElementById('wordlist');
  wl.innerHTML = '';
  state.placed.forEach(({word, hint}) => {
    const chip = document.createElement('div');
    chip.className = 'wchip' + (state.found.has('w:'+word) ? ' done' : '');
    chip.textContent = hint || word;
    chip.title = hint ? word : '';
    wl.appendChild(chip);
  });
}

// --- POINTER EVENTS ---
function cellKey(td) { return td.dataset.r + ',' + td.dataset.c; }

function onPDown(e) {
  e.preventDefault();
  state.dragging = true;
  state.sel = [{ r: +e.target.dataset.r, c: +e.target.dataset.c }];
  state.selSet = new Set([cellKey(e.target)]);
  e.target.setPointerCapture(e.pointerId);
  renderGrid();
}

function onPEnter(e) {
  if (!state.dragging) return;
  const r = +e.target.dataset.r, c = +e.target.dataset.c;
  if (!state.sel.length) return;
  const start = state.sel[0];
  // build line from start to current
  const dr = r - start.r, dc = c - start.c;
  const len = Math.max(Math.abs(dr), Math.abs(dc));
  if (len === 0) return;
  const stepR = dr === 0 ? 0 : dr/Math.abs(dr);
  const stepC = dc === 0 ? 0 : dc/Math.abs(dc);
  // only straight / diagonal
  if (Math.abs(dr) !== Math.abs(dc) && dr !== 0 && dc !== 0) return;
  const newSel = [];
  const newSet = new Set();
  for (let i = 0; i <= len; i++) {
    const nr = start.r + stepR*i, nc = start.c + stepC*i;
    if (nr < 0 || nr >= state.gridSize || nc < 0 || nc >= state.gridSize) break;
    newSel.push({r:nr,c:nc});
    newSet.add(nr+','+nc);
  }
  state.sel    = newSel;
  state.selSet = newSet;
  renderGrid();
}

function onPUp(e) {
  if (!state.dragging) return;
  state.dragging = false;
  checkSelection();
  state.sel    = [];
  state.selSet = new Set();
  renderGrid();
}

function checkSelection() {
  if (state.sel.length < 2) return;
  const selected = state.sel.map(({r,c}) => state.grid[r][c]).join('');
  for (const pw of state.placed) {
    if (state.found.has('w:'+pw.word)) continue;
    if (selected === pw.word || selected === [...pw.word].reverse().join('')) {
      // mark cells found
      pw.cells.forEach(([r,c]) => state.found.add(r+','+c));
      state.found.add('w:'+pw.word);
      renderWordList();
      checkWin();
      return;
    }
  }
}

function checkWin() {
  const total = state.placed.length;
  const done  = state.placed.filter(pw => state.found.has('w:'+pw.word)).length;
  if (done === total) {
    clearInterval(state.timerInterval);
    const msg = document.getElementById('msg');
    msg.textContent = state.lang === 'kz' ? '🎉 Барлық сөздер табылды!' : '🎉 Все слова найдены!';
  }
}

// --- TIMER ---
function startTimer() {
  clearInterval(state.timerInterval);
  const el = document.getElementById('timer');
  if (!state.maxTime) { el.textContent = ''; return; }

  function fmt(s) {
    const m = Math.floor(s/60), sec = s%60;
    return m + ':' + String(sec).padStart(2,'0');
  }
  el.textContent = fmt(state.timeLeft);
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    el.textContent = fmt(state.timeLeft);
    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      document.getElementById('msg').textContent =
        state.lang === 'kz' ? '⏰ Уақыт бітті!' : '⏰ Время вышло!';
    }
  }, 1000);
}
