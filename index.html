<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой автомат</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: sans-serif;
        }

        #game-container {
            position: relative;
            width: 800px; 
            height: 600px; 
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #machine {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 90%; 
            z-index: 2;
        }

        /* --- Игрушки (опустили ниже и сжали) --- */
        #toys-area {
            position: absolute;
            top: 40%; /* Опустили ниже */
            left: 50%;
            transform: translateX(-50%);
            width: 260px; /* Сузили по ширине стекла */
            height: 200px;
            z-index: 3;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }

        .toy {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- Временный Хвататель (серый блок) --- */
        #claw {
            position: absolute;
            top: 25%; /* Высота над игрушками */
            left: 50%; /* Начальная позиция по центру */
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            background-color: #888; /* Серый цвет для наглядности */
            border-radius: 5px;
            z-index: 4;
            transition: left 0.3s ease-out; /* Плавное движение влево-вправо */
        }

        /* Трос временного хватателя */
        #claw::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 200px; 
            background-color: #333;
        }

        /* --- Монетка --- */
        #coin {
            position: absolute;
            width: 50px; 
            top: 58%; /* Подняли чуть выше к монетоприемнику */
            right: 28%; /* Сдвинули правее */
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .blinking {
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(1.5); transform: scale(1.1); box-shadow: 0 0 10px gold; border-radius: 50%; }
        }

        /* --- Кнопки --- */
        #controls {
            position: absolute;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px; /* Увеличил расстояние между кнопками */
            z-index: 10;
            opacity: 0.5; 
            pointer-events: none; /* Не нажимаются до монетки */
        }

        #controls.active {
            opacity: 1;
            pointer-events: auto;
        }

        .control-btn {
            background: linear-gradient(145deg, #ff4e50, #f9d423);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .control-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="machine" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/avtomat.png" alt="Автомат">
        
        <div id="claw"></div>

        <div id="toys-area"></div>

        <img id="coin" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/монета.png" alt="Монета" class="blinking">

        <div id="controls">
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-down">▼</div>
            <div class="control-btn" id="btn-right">▶</div>
        </div>
    </div>

    <audio id="coin-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <audio id="start-sound" src="https://assets.mixkit.co/active_storage/sfx/1997/1997-preview.mp3"></audio>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/';
        const toysArea = document.getElementById('toys-area');
        const coin = document.getElementById('coin');
        const controls = document.getElementById('controls');
        const claw = document.getElementById('claw');
        
        let gameState = 'waiting_coin'; 
        let currentToys = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        let clawPos = 50; // Позиция клешни по горизонтали (в процентах)

        // 1. Добавляем игрушки
        function initToys() {
            toysArea.innerHTML = '';
            currentToys.forEach(num => {
                const img = document.createElement('img');
                img.src = `${baseUrl}${num}.png`;
                img.className = 'toy';
                img.id = `toy-${num}`;
                toysArea.appendChild(img);
            });
        }

        // 2. Обработка клика по монетке
        coin.addEventListener('click', () => {
            if (gameState !== 'waiting_coin') return;
            
            // Воспроизводим звук монетки
            document.getElementById('coin-sound').play();
            
            // Через 0.5 секунды воспроизводим звук старта автомата
            setTimeout(() => {
                document.getElementById('start-sound').play();
            }, 500);
            
            gameState = 'playing';
            coin.classList.remove('blinking');
            coin.style.opacity = '0'; 
            controls.classList.add('active');
        });

        // 3. Движение хватателя
        document.getElementById('btn-left').addEventListener('click', () => {
            if (gameState === 'playing' && clawPos > 20) {
                clawPos -= 15; // Шаг влево
                claw.style.left = clawPos + '%';
            }
        });

        document.getElementById('btn-right').addEventListener('click', () => {
            if (gameState === 'playing' && clawPos < 80) {
                clawPos += 15; // Шаг вправо
                claw.style.left = clawPos + '%';
            }
        });

        document.getElementById('btn-down').addEventListener('click', () => {
            if (gameState === 'playing') {
                console.log('Клешня поехала вниз за игрушкой!');
                // Логику спуска пропишем на следующем этапе
            }
        });

        initToys();
    </script>
</body>
</html>
