<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор позиций клешни</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: sans-serif; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png');
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
        }

        #machine-no-claw {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            height: 95%; pointer-events: none; z-index: 10;
        }

        .game-element { position: absolute; object-fit: contain; }

        /* Игрушки стоят жестко для ориентира */
        .toy { z-index: 15; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5)); opacity: 0.8; }
        #toy-1 { left: 41.53%; top: 29.86%; width: 3.97%; height: 9.19%; }
        #toy-5 { left: 40.86%; top: 40.27%; width: 4.91%; height: 9.59%; }
        #toy-9 { left: 40.52%; top: 50.95%; width: 5.31%; height: 10.27%; }
        #toy-4 { left: 47.45%; top: 30.27%; width: 3.97%; height: 9.32%; }
        #toy-3 { left: 47.65%; top: 40.68%; width: 3.76%; height: 9.32%; }
        #toy-8 { left: 47.31%; top: 51.35%; width: 4.37%; height: 9.86%; }
        #toy-6 { left: 53.36%; top: 30.00%; width: 4.37%; height: 9.05%; }
        #toy-2 { left: 53.36%; top: 40.27%; width: 4.37%; height: 9.59%; }
        #toy-7 { left: 53.63%; top: 51.08%; width: 4.50%; height: 10.27%; }

        /* Три клешни для настройки */
        .draggable {
            position: absolute; resize: both; overflow: hidden;
            border: 2px dashed #00ff00; background: rgba(0, 255, 0, 0.2);
            cursor: move; z-index: 100;
        }
        .draggable img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .label { position: absolute; top: 0; left: 0; background: #000; color: #0f0; font-size: 10px; padding: 2px; }

        #output-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; 
            justify-content: center; align-items: center; color: white;
        }
        textarea { width: 50%; height: 50%; font-family: monospace; font-size: 16px; padding: 15px; margin-top: 20px; color: #00ff00; background: #111; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="machine-no-claw" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/avtomat.png">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/1.png" class="game-element toy" id="toy-1">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/5.png" class="game-element toy" id="toy-5">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/9.png" class="game-element toy" id="toy-9">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/4.png" class="game-element toy" id="toy-4">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/3.png" class="game-element toy" id="toy-3">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/8.png" class="game-element toy" id="toy-8">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/6.png" class="game-element toy" id="toy-6">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/2.png" class="game-element toy" id="toy-2">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/7.png" class="game-element toy" id="toy-7">

        <div class="draggable" id="claw-left" style="left: 20%; top: 10%; width: 10%; height: 25%;">
            <div class="label">ЛЕВО</div>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/клешня.png">
        </div>
        <div class="draggable" id="claw-center" style="left: 45%; top: 10%; width: 10%; height: 25%;">
            <div class="label">ЦЕНТР</div>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/клешня.png">
        </div>
        <div class="draggable" id="claw-right" style="left: 70%; top: 10%; width: 10%; height: 25%;">
            <div class="label">ПРАВО</div>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/клешня.png">
        </div>
    </div>

    <div id="output-overlay">
        <h1 style="color: #00ff00; margin: 0;">Готово!</h1>
        <p>Скопируйте новые координаты клешней и пришлите мне:</p>
        <textarea id="config-text" readonly></textarea>
    </div>

    <script>
        const container = document.getElementById('game-container');
        let dragEl = null;
        let offsetX = 0, offsetY = 0;

        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const rect = el.getBoundingClientRect();
                const isResize = (e.clientX > rect.right - 25) && (e.clientY > rect.bottom - 25);

                if (!isResize) {
                    dragEl = el;
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    document.querySelectorAll('.draggable').forEach(d => d.style.zIndex = 100);
                    el.style.zIndex = 101;
                }
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (dragEl) {
                const containerRect = container.getBoundingClientRect();
                let newLeft = e.clientX - containerRect.left - offsetX;
                let newTop = e.clientY - containerRect.top - offsetY;
                
                dragEl.style.left = newLeft + 'px';
                dragEl.style.top = newTop + 'px';
            }
        });

        document.addEventListener('mouseup', () => { dragEl = null; });

        // Сохранение координат
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let config = {};
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;

                document.querySelectorAll('.draggable').forEach(el => {
                    config[el.id] = {
                        left: (el.offsetLeft / containerWidth * 100).toFixed(2) + '%',
                        top: (el.offsetTop / containerHeight * 100).toFixed(2) + '%',
                        width: (el.offsetWidth / containerWidth * 100).toFixed(2) + '%',
                        height: (el.offsetHeight / containerHeight * 100).toFixed(2) + '%'
                    };
                });

                document.getElementById('config-text').value = JSON.stringify(config, null, 4);
                document.getElementById('output-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
