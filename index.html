<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Игровой автомат — Редактор</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCgdd6XECishFQr8at6csp-pVeLsruDfK4",
      authDomain: "shkatulka-games.firebaseapp.com",
      databaseURL: "https://shkatulka-games-default-rtdb.firebaseio.com",
      projectId: "shkatulka-games",
      storageBucket: "shkatulka-games.firebasestorage.app",
      messagingSenderId: "1090190974514",
      appId: "1:1090190974514:web:b4e017ec633d6c9057262b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Neucha&display=swap');
    html, body { height: 100%; margin: 0; overflow: hidden; position: relative; }
    :root{ --text:#eaf0ff; --muted:#a9b6e6; --border: rgba(255,255,255,.10); --shadow2: 0 12px 34px rgba(0,0,0,.40); --radius: 18px; --radius2: 22px; --neon:#d6b14a; --danger:#ff4d4d; --ok:#2dd27d; --neon-orange-base: #ffae00; --neon-orange-glow: rgba(255, 136, 0, 0.6); --neon-box-shadow: 0 0 5px var(--neon-orange-glow), 0 0 15px var(--neon-orange-glow), inset 0 0 5px rgba(255, 136, 0, 0.2); }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{ color:var(--text); background: radial-gradient(1100px 700px at 12% 18%, rgba(35,82,200,.28) 0%, rgba(5,8,22,0) 58%), radial-gradient(900px 640px at 88% 16%, rgba(20,160,255,.18) 0%, rgba(5,8,22,0) 62%), radial-gradient(1000px 780px at 55% 112%, rgba(214,177,74,.14) 0%, rgba(5,8,22,0) 58%), linear-gradient(180deg, rgba(4,10,32,.92), rgba(3,6,18,1)); }
    body.gameOnly{background:transparent}
    .app{ display:grid; grid-template-columns: 460px 1fr; gap:14px; padding:14px; max-width: 1540px; margin: 0 auto; height: 100%; }
    .panel{ background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04)); border:1px solid var(--neon-orange-base) !important; border-radius:var(--radius2); box-shadow: var(--neon-box-shadow), var(--shadow2) !important; backdrop-filter: blur(10px); overflow:hidden; position:relative; }
    .panel-header{ padding:12px 14px; border-bottom:1px solid rgba(255,255,255,.10); display:flex;align-items:center;justify-content:space-between;gap:10px; }
    .settings{ height: 100%; display:flex; flex-direction:column; min-height: 0; }
    .settings .panel-body{ overflow-y: auto; flex: 1; min-height: 0; padding:14px; }
    .section{ padding:12px 12px; border-radius:16px; border:1px solid rgba(255,174,0,0.5) !important; background:rgba(20,10,0,0.3) !important; margin-bottom:12px; box-shadow: 0 0 8px rgba(255, 136, 0, 0.3) !important; }
    .section .title{ font-weight:950; font-size:13.5px; margin-bottom:10px; color:rgba(255,255,255,.92); display:flex;align-items:center;justify-content:space-between;gap:8px; }
    label{ display:block; font-size:12.5px; color:rgba(255,255,255,.86); margin:10px 0 6px }
    input[type="text"], input[type="number"], textarea, select{ width:100%; border-radius:14px; padding:10px 11px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.25); color:var(--text); outline:none; }
    .btn{ padding:11px 12px; border-radius:14px; border:1px solid var(--neon-orange-base) !important; background:rgba(255,255,255,.06); color:var(--text); cursor:pointer; font-weight:950; font-size:14px; transition:0.1s ease; display:inline-flex; align-items:center; justify-content:center; gap:8px; user-select:none; }
    .btn:hover{box-shadow: 0 0 10px var(--neon-orange-glow) !important; background: rgba(255, 136, 0, 0.15) !important;}
    .btn.primary{ background: linear-gradient(90deg, rgba(255, 174, 0, 0.4), rgba(255, 136, 0, 0.3)) !important; }
    .q-item{ padding:10px 10px; border-radius:14px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); display:flex; gap:10px; align-items:center; justify-content:space-between; transition: 0.2s; }
    .preview{ height: 100%; display:flex; flex-direction:column; padding:0; overflow:hidden; }
    .preview-stage{ flex: 1; position:relative; border-radius:var(--radius2); border:1px solid rgba(255,255,255,.10); overflow:hidden; background:rgba(0,0,0,.18); box-shadow: var(--shadow2); }
    /* ЛИПКАЯ ПАНЕЛЬ НАСТРОЕК */
    .toy-side{ border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.18); border-radius:16px; padding:12px; position: sticky; top: 0; }
    .toy-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    .toy-cell{ position:relative; aspect-ratio:1; border-radius:18px; border:2px solid rgba(255,174,0,.35); background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.13), rgba(0,0,0,.22)); overflow:hidden; cursor:pointer; }
    .toy-cell.selected{ border-color:var(--neon-orange-base); box-shadow:0 0 14px var(--neon-orange-glow); }
    .toy-edit-img{ position:absolute; object-fit:contain; transform:translate(-50%,-50%); filter:drop-shadow(2px 4px 4px rgba(0,0,0,.45)); }
    .toast{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:rgba(0,0,0,.7); border:1px solid var(--neon-orange-base); color:#fff; padding:10px 12px; border-radius:14px; backdrop-filter: blur(10px); opacity:0; transition:0.2s; z-index:999999; }
    .toast.show{ opacity:1; }
    .modal-backdrop{ position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(8px); display: none; z-index: 999998; }
    .modal{ position: absolute; top: 15px; bottom: 15px; left: 15px; right: 15px; margin: auto; max-width: 900px; display: flex; flex-direction: column; border-radius: 20px; border: 1px solid var(--neon-orange-base) !important; background: #16110c !important; overflow: hidden; }
  </style>
</head>
<body>
  <div class="app" id="editorRoot">
    <div class="panel settings">
      <div class="panel-header" style="flex-wrap: wrap; gap: 14px;">
        <div style="display:flex; flex-direction:column;">
          <span style="font-size: 16px; font-weight: 900;">Шкатулка математических интерактивов</span>
          <span style="font-size: 11px; color: var(--neon-orange-base);">Редактор «Игровой автомат»</span>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn" onclick="if(confirm('Сбросить всё?')) location.reload()">🔄 Сбросить</button>
          <button class="btn primary" id="btnCopyCode">☁️ Сохранить и Скопировать</button>
        </div>
      </div>
      <div class="panel-body">
        <div class="section">
          <div class="title">Название</div>
          <input id="inpTitle" type="text" value="Игровой автомат" />
        </div>
        <div class="section">
          <div class="title">Оформление</div>
          <label>Фон игры</label>
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <div id="bgStatus" style="flex:1; font-size:12px; color:#aaa;">Стандартный фон</div>
            <input type="file" id="inpBgFile" accept="image/*" style="display:none">
            <button class="btn small primary" onclick="$('inpBgFile').click()">📁 Загрузить</button>
            <button class="btn small danger" id="btnResetBg">✖</button>
          </div>
          <label>Стиль автомата</label>
          <select id="selMachineVariant">
            <option value="0">Вариант 1 (Стандарт)</option>
            <option value="1">Вариант 2 (Неон)</option>
            <option value="2">Вариант 3 (Космос)</option>
            <option value="3">Вариант 4 (Золото)</option>
          </select>
          <button class="btn" style="width:100%; margin-top:12px;" onclick="openToyModal()">🧸 Настроить игрушки</button>
        </div>
        <div class="section">
          <div class="title">Вопросы <span id="pillCount" style="color:var(--neon-orange-base)">0 / 9</span></div>
          <button class="btn primary" style="width:100%; margin-bottom:10px;" onclick="openModal()">➕ Добавить вопрос</button>
          <div class="q-list" id="qList"></div>
        </div>
      </div>
    </div>
    <div class="panel preview">
      <div class="panel-header"><div>Предпросмотр (обновляется мгновенно)</div></div>
      <div class="preview-stage"><iframe id="livePreview" style="width:100%;height:100%;border:0;background:transparent;" allow="autoplay; fullscreen"></iframe></div>
    </div>
  </div>

  <div class="modal-backdrop" id="toyBackdrop"><div class="modal" style="padding:20px;">
    <div style="display:grid; grid-template-columns: 1fr 300px; gap:20px;">
      <div id="toyGrid" class="toy-grid"></div>
      <div class="toy-side">
        <div id="toySelectedTitle" style="font-weight:950; color:var(--neon-orange-base); margin-bottom:15px;">Игрушка #1</div>
        <input type="file" id="inpToyFile" accept="image/*" style="display:none">
        <button class="btn primary" style="width:100%;" onclick="$('inpToyFile').click()">📁 Загрузить с компьютера</button>
        <button class="btn small" style="width:100%; margin-top:10px;" id="btnRemoveToyBg">✨ Удалить фон</button>
        <div style="display:flex; gap:5px; margin-top:10px;">
           <button class="btn small danger" style="flex:1" id="btnResetToy">Сбросить</button>
           <button class="btn small" style="flex:1" id="btnCenterToy">В центр</button>
        </div>
        <button class="btn primary" style="width:100%; margin-top:20px;" onclick="$('toyBackdrop').style.display='none'">Готово</button>
      </div>
    </div>
  </div></div>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" style="padding:20px; max-width:600px;">
    <label>Текст вопроса</label>
    <textarea id="inpPrompt" placeholder="Введите вопрос..."></textarea>
    <label>Картинка</label>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:15px;">
        <div id="qImgStatus" style="flex:1; color:#aaa; font-size:12px;">❌ Нет картинки</div>
        <input type="file" id="inpQFile" accept="image/*" style="display:none">
        <button class="btn small primary" onclick="$('inpQFile').click()">📁 Загрузить</button>
    </div>
    <div id="choiceList"></div>
    <button class="btn small" onclick="addOption()">➕ Вариант</button>
    <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn" onclick="$('modalBackdrop').style.display='none'">Отмена</button>
        <button class="btn primary" id="btnSaveQ">💾 Сохранить</button>
    </div>
  </div></div>

  <div class="toast" id="toast">Скопировано</div>

<script>
(() => {
  const $ = (id)=>document.getElementById(id);
  const TOY_BASE_URL = "https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/";
  const TOY_IDS = [1,4,6,5,3,2,9,8,7];
  let selectedToyIdx = 0;
  const Editor = { title: "Игровой автомат", bgDataUrl: "", machineVariant: 0, toys: Array.from({length:9}, ()=>({src:"", scale:1, offsetX:0, offsetY:0})), questions: [] };

  // СЖИМАТЕЛЬ
  window.compressImage = (file, maxSize = 200) => new Promise(res => {
    const reader = new FileReader(); reader.readAsDataURL(file);
    reader.onload = e => {
      const img = new Image(); img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if(w > h) { if(w > maxSize) { h *= maxSize / w; w = maxSize; } } else { if(h > maxSize) { w *= maxSize / h; h = maxSize; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        res(canvas.toDataURL("image/webp", 0.6));
      };
    };
  });

  // МГНОВЕННОЕ ОБНОВЛЕНИЕ
  function updatePreview() {
    const iframe = $("livePreview");
    const payload = JSON.parse(JSON.stringify(Editor)); 
    if (iframe.contentWindow && iframe.dataset.loaded === "true") {
      iframe.contentWindow.postMessage({ type: 'UPDATE_CONFIG', config: payload }, '*');
    } else {
      const data = "~" + LZString.compressToEncodedURIComponent(JSON.stringify({ti:payload.title, bg:payload.bgDataUrl, mv:payload.machineVariant, q:[], ty:[]}));
      iframe.src = location.origin + location.pathname + "?preview=1&game=" + data;
      iframe.onload = () => { iframe.dataset.loaded = "true"; updatePreview(); };
    }
  }

  // ПАНЕЛЬ ИГРУШЕК
  window.openToyModal = () => { renderToyGrid(); $("toyBackdrop").style.display="block"; };
  function renderToyGrid(){
    const grid = $("toyGrid"); grid.innerHTML = "";
    TOY_IDS.forEach(id => {
      const idx = id - 1; const t = Editor.toys[idx]; const cell = document.createElement("div");
      cell.className = "toy-cell" + (idx === selectedToyIdx ? " selected" : "");
      cell.innerHTML = `<div style="position:absolute;left:5px;top:5px;font-size:10px;">#${id}</div>`;
      const img = document.createElement("img"); img.className = "toy-edit-img";
      img.src = t.src || (TOY_BASE_URL + id + ".png");
      img.style.width = (60 * t.scale) + "%"; img.style.left = (50 + t.offsetX) + "%"; img.style.top = (50 + t.offsetY) + "%";
      cell.onclick = () => { selectedToyIdx = idx; renderToyGrid(); $("toySelectedTitle").textContent = "Игрушка #" + id; };
      cell.appendChild(img); grid.appendChild(cell);
    });
  }

  // СОБЫТИЯ
  $("inpTitle").oninput = (e) => { Editor.title = e.target.value; updatePreview(); };
  $("selMachineVariant").onchange = (e) => { Editor.machineVariant = Number(e.target.value); updatePreview(); };
  $("inpBgFile").onchange = async (e) => {
    Editor.bgDataUrl = await window.compressImage(e.target.files[0], 1024);
    $("bgStatus").textContent = "✅ Загружен"; updatePreview();
  };
  $("btnResetBg").onclick = () => { Editor.bgDataUrl = ""; $("bgStatus").textContent = "Стандартный"; updatePreview(); };
  $("inpToyFile").onchange = async (e) => {
    Editor.toys[selectedToyIdx].src = await window.compressImage(e.target.files[0], 150);
    renderToyGrid(); updatePreview();
  };

  // FIREBASE
  $("btnCopyCode").onclick = async () => {
    const btn = $("btnCopyCode"); btn.textContent = "⏳...";
    const id = "g_" + Date.now().toString(36);
    const data = "~" + LZString.compressToEncodedURIComponent(JSON.stringify({ti:Editor.title, bg:Editor.bgDataUrl, mv:Editor.machineVariant, ty:Editor.toys.map(t=>t.src?{s:t.src, z:t.scale, x:t.offsetX, y:t.offsetY}:null), q:Editor.questions}));
    await db.ref('games/' + id).set({ d: data, t: Date.now() });
    navigator.clipboard.writeText(`<iframe src="${location.origin + location.pathname}?id=${id}" style="width:100%;height:100%;border:0;border-radius:18px;background:transparent" allowfullscreen></iframe>`);
    btn.textContent = "📋 Скопировано!"; setTimeout(()=>btn.textContent="☁️ Сохранить и Скопировать", 2000);
  };

  // ЛОГИКА ВНУТРИ ИГРЫ (ОБРАБОТКА postMessage)
  if (new URLSearchParams(location.search).get("preview")) {
    window.addEventListener('message', (e) => {
      if (e.data.type === 'UPDATE_CONFIG') {
         window.__CFG = e.data.config;
         // Исправляем путь: вызываем initGameData, который живет в движке
         if (typeof window.initGameData === 'function') window.initGameData();
         else if (typeof initGameData === 'function') initGameData();
      }
    });
  }

  updatePreview();
})();
</script>
</body>
</html>
