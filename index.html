<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор размеров клешни</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: sans-serif; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png');
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
        }

        #machine-no-claw {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            height: 95%; pointer-events: none; z-index: 10;
        }

        /* Игрушки для ориентира (центральный ряд) */
        .toy {
            position: absolute; z-index: 15;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
            opacity: 0.6; pointer-events: none;
        }
        #toy-4 { left: 47.72%; top: 32.70%; width: 3.76%; height: 9.46%; }
        #toy-3 { left: 47.65%; top: 42.97%; width: 3.83%; height: 9.19%; }
        #toy-8 { left: 47.65%; top: 54.19%; width: 4.03%; height: 9.46%; }

        /* Настраиваемые элементы клешни */
        .draggable {
            position: absolute; resize: both; overflow: hidden;
            cursor: move; z-index: 100;
            display: flex; justify-content: center; align-items: center;
        }
        
        #claw-closed {
            border: 2px dashed #00ff00; background: rgba(0, 255, 0, 0.2);
            left: 38%; top: 20%; width: 7.46%; height: 20.27%;
        }
        
        #claw-open {
            border: 2px dashed #ff9900; background: rgba(255, 153, 0, 0.2);
            left: 50%; top: 20%; width: 7.46%; height: 20.27%;
        }

        .draggable img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .label { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.8); color: #fff; font-size: 12px; padding: 2px 5px; pointer-events: none; font-weight: bold; }

        /* Всплывающее окно с кодом */
        #output-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; 
            justify-content: center; align-items: center; color: white;
        }
        textarea { width: 50%; height: 40%; font-family: monospace; font-size: 18px; padding: 15px; margin-top: 20px; color: #00ff00; background: #111; border: 1px solid #333; outline: none; }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="machine-no-claw" src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/avtomat.png">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/4.png" class="toy" id="toy-4">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/3.png" class="toy" id="toy-3">
        <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/8.png" class="toy" id="toy-8">

        <div class="draggable" id="claw-closed">
            <div class="label">ЗАКРЫТАЯ</div>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/клешня.png">
        </div>
        
        <div class="draggable" id="claw-open">
            <div class="label">ОТКРЫТАЯ</div>
            <img src="https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/10.png">
        </div>
    </div>

    <div id="output-overlay">
        <h1 style="color: #00ff00; margin: 0;">Супер! Размеры зафиксированы!</h1>
        <p>Скопируйте полученный текст и пришлите мне:</p>
        <textarea id="config-text" readonly></textarea>
    </div>

    <script>
        const container = document.getElementById('game-container');
        
        let dragEl = null;
        let offsetX = 0, offsetY = 0;

        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const rect = el.getBoundingClientRect();
                const isResize = (e.clientX > rect.right - 25) && (e.clientY > rect.bottom - 25);

                if (!isResize) {
                    dragEl = el;
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    
                    document.querySelectorAll('.draggable').forEach(d => d.style.zIndex = 100);
                    el.style.zIndex = 101;
                }
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (dragEl) {
                const containerRect = container.getBoundingClientRect();
                let newLeft = e.clientX - containerRect.left - offsetX;
                let newTop = e.clientY - containerRect.top - offsetY;
                
                dragEl.style.left = newLeft + 'px';
                dragEl.style.top = newTop + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (dragEl) { dragEl = null; }
        });

        // Сохранение размеров по Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let config = {};
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;

                document.querySelectorAll('.draggable').forEach(el => {
                    config[el.id] = {
                        width: (el.offsetWidth / containerWidth * 100).toFixed(2) + '%',
                        height: (el.offsetHeight / containerHeight * 100).toFixed(2) + '%'
                    };
                });

                document.getElementById('config-text').value = JSON.stringify(config, null, 4);
                document.getElementById('output-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
