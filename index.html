<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конфигуратор Игры - Полный Экран</title>
    <style>
        /* Никаких отступов, скроллов и черных полос */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #000;
        }
        
        /* Фон на весь экран */
        #game-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background-image: url('https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/фон.png'); 
            background-size: 100% 100%; /* Жестко заполняет весь экран от края до края */
            background-position: center; 
            background-repeat: no-repeat;
        }

        /* Настройки для элементов, которые мы двигаем */
        .draggable {
            position: absolute;
            resize: both; 
            overflow: hidden;
            border: 2px dashed #00ff00; 
            background: rgba(0, 255, 0, 0.1);
            cursor: move;
            z-index: 10; 
            width: 60px; 
            height: 60px;
        }

        .draggable img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            pointer-events: none;
        }

        /* Визуализация кнопок */
        .config-btn {
            background: radial-gradient(circle, #ff6b6b, #ee5253);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 100%; 
            height: 100%; 
            color: white;
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-size: 24px; 
            font-weight: bold; 
            pointer-events: none; 
            user-select: none;
        }

        /* Заглушки для зон */
        #drop-area { border-color: #ff0000; background: rgba(255, 0, 0, 0.3); }
        #drop-area::after { content: "ПАДЕНИЕ"; position: absolute; color: white; font-size: 12px; font-family: sans-serif; text-align: center; top: 50%; width: 100%; transform: translateY(-50%); }
        
        #progress-area { border-color: #0000ff; background: rgba(0, 0, 255, 0.3); width: 80px; height: 400px; }
        #progress-area::after { content: "ПРОГРЕСС"; position: absolute; color: white; font-size: 12px; font-family: sans-serif; text-align: center; top: 50%; width: 100%; transform: translateY(-50%) rotate(-90deg); }

        /* Окно с кодом */
        #output-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; 
            justify-content: center; align-items: center; color: white; font-family: sans-serif;
        }
        textarea { width: 80%; height: 60%; font-family: monospace; font-size: 16px; padding: 15px; margin-top: 20px; color: #00ff00; background: #111; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="game-container">
        </div>

    <div id="output-overlay">
        <h1 style="color: #00ff00; margin: 0;">Координаты готовы!</h1>
        <p>Скопируйте текст ниже и пришлите мне:</p>
        <textarea id="config-text" readonly></textarea>
    </div>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/svetlana18011991/avtomat_igrovoy/main/';
        const container = document.getElementById('game-container');
        
        // Наши элементы
        const itemsToPlace = [
            { id: 'toy-1', type: 'img', src: '1.png' },
            { id: 'toy-2', type: 'img', src: '2.png' },
            { id: 'toy-3', type: 'img', src: '3.png' },
            { id: 'toy-4', type: 'img', src: '4.png' },
            { id: 'toy-5', type: 'img', src: '5.png' },
            { id: 'toy-6', type: 'img', src: '6.png' },
            { id: 'toy-7', type: 'img', src: '7.png' },
            { id: 'toy-8', type: 'img', src: '8.png' },
            { id: 'toy-9', type: 'img', src: '9.png' },
            { id: 'claw', type: 'img', src: 'клешня.png' },
            { id: 'coin', type: 'img', src: 'монета.png' },
            { id: 'btn-left', type: 'div', content: '<div class="config-btn">◀</div>' },
            { id: 'btn-right', type: 'div', content: '<div class="config-btn">▶</div>' },
            { id: 'btn-action', type: 'div', content: '<div class="config-btn">🔘</div>' },
            { id: 'drop-area', type: 'zone' },
            { id: 'progress-area', type: 'zone' }
        ];

        // Создаем элементы
        itemsToPlace.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'draggable';
            el.id = item.id;
            
            // Раскидываем лесенкой по экрану
            el.style.left = (20 + index * 25) + 'px';
            el.style.top = (20 + index * 25) + 'px';

            if (item.type === 'img') {
                el.innerHTML = `<img src="${baseUrl}${item.src}">`;
            } else if (item.type === 'div') {
                el.innerHTML = item.content;
            }
            container.appendChild(el);
        });

        // Перетаскивание
        let dragEl = null;
        let offsetX = 0, offsetY = 0;

        document.querySelectorAll('.draggable').forEach(el => {
            el.addEventListener('mousedown', (e) => {
                const rect = el.getBoundingClientRect();
                const isResize = (e.clientX > rect.right - 25) && (e.clientY > rect.bottom - 25);

                if (!isResize) {
                    dragEl = el;
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    document.querySelectorAll('.draggable').forEach(d => d.style.zIndex = 10);
                    el.style.zIndex = 100;
                }
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (dragEl) {
                const containerRect = container.getBoundingClientRect();
                let newLeft = e.clientX - containerRect.left - offsetX;
                let newTop = e.clientY - containerRect.top - offsetY;
                
                dragEl.style.left = newLeft + 'px';
                dragEl.style.top = newTop + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (dragEl) { dragEl = null; }
        });

        // Сохранение координат по Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let config = {};
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;

                document.querySelectorAll('.draggable').forEach(el => {
                    config[el.id] = {
                        left: (el.offsetLeft / containerWidth * 100).toFixed(2) + '%',
                        top: (el.offsetTop / containerHeight * 100).toFixed(2) + '%',
                        width: (el.offsetWidth / containerWidth * 100).toFixed(2) + '%',
                        height: (el.offsetHeight / containerHeight * 100).toFixed(2) + '%'
                    };
                });

                document.getElementById('config-text').value = JSON.stringify(config, null, 4);
                document.getElementById('output-overlay').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
